<div class="card" id="cardTripStat">
  <div class="sec-inline">行程统计<span class="sec-now" id="tripStatKind">本周</span></div>
  <div class="trip-seg" id="tripSeg">
    <button type="button" class="trip-seg-b on" data-span="week">周</button>
    <button type="button" class="trip-seg-b" data-span="month">月</button>
    <button type="button" class="trip-seg-b" data-span="year">年</button>
  </div>
  <div class="trip-kpis">
    <div class="trip-kpi"><b id="tkKm">--</b><span>里程 km</span></div>
    <div class="trip-kpi"><b id="tkCnt">--</b><span>行程数</span></div>
    <div class="trip-kpi"><b id="tkAvg">--</b><span>单次均值</span></div>
    <div class="trip-kpi"><b id="tkDelta">--</b><span>对比上期</span></div>
  </div>
  <div class="trip-bars" id="tripBars"></div>
  <div class="trip-hint" id="tripStatHint">按本机保存的行程统计。</div>
</div>
