<!-- 4.2 换肤：只改配色，不动功能。状态落 localStorage（key = kc_skin） -->
<div class="card" id="cardSkin">
  <div class="sec-inline">外观<span class="sec-now" id="skinNow">夜间仪表</span></div>
  <div class="skin-row" id="skinRow">
    <button class="skin-opt active" type="button" data-skin="night">
      <i class="skin-sw skin-sw-night"><b></b><u></u></i>
      <b>夜间仪表</b><span>石墨 + 琥珀</span>
    </button>
    <button class="skin-opt" type="button" data-skin="platinum">
      <i class="skin-sw skin-sw-platinum"><b></b><u></u></i>
      <b>白金</b><span>铂银 + 香槟金</span>
    </button>
    <button class="skin-opt" type="button" data-skin="day">
      <i class="skin-sw skin-sw-day"><b></b><u></u></i>
      <b>白天</b><span>浅色搪塑</span>
    </button>
  </div>
  <div class="hint" id="skinHint">换肤只影响配色，不改判定阈值、蓝牙与车控设置。</div>
</div>
