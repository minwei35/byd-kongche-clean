<div class="sheet" id="sheetThr" hidden>
  <div class="sheet-card">
    <div class="sheet-title">阈值精确设定</div>
    <div class="sheet-sub">拖动只能凑个大概，这里填准确值。进入阈值要高于离开阈值，否则会在边界来回跳。</div>
    <div class="thr-row">
      <span class="thr-k">进入阈值<i>靠近 = 解锁</i></span>
      <input class="tune-input" id="thrEnter" type="number" inputmode="numeric" min="-90" max="-30" step="1">
      <span class="thr-u">dBm</span>
    </div>
    <div class="thr-row">
      <span class="thr-k">离开阈值<i>远离 = 锁车</i></span>
      <input class="tune-input" id="thrExit" type="number" inputmode="numeric" min="-100" max="-40" step="1">
      <span class="thr-u">dBm</span>
    </div>
    <div class="thr-presets">
      <button type="button" data-thr-preset="1" data-en="-60" data-ex="-70">近场 -60/-70</button>
      <button type="button" data-thr-preset="1" data-en="-70" data-ex="-80">默认 -70/-80</button>
      <button type="button" data-thr-preset="1" data-en="-75" data-ex="-85">保守 -75/-85</button>
    </div>
    <div class="thr-tip" id="thrTip">当前生效：--</div>
    <div class="thr-msg" id="thrMsg"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="btnThrCancel" type="button">取消</button>
      <button class="btn btn-primary" id="btnThrSave" type="button">保存</button>
    </div>
  </div>
</div>
