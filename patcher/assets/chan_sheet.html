<div class="sheet" id="sheetChan" hidden>
  <div class="sheet-card">
    <div class="sheet-title">这条指令走哪条路</div>
    <div class="chan-hero">
      <span class="chan-big" id="chanState" data-chan="cloud">云端通道</span>
      <span class="chan-eta" id="chanEta">约 10~30 秒</span>
    </div>
    <div class="chan-why" id="chanWhy">正在读取当前通道…</div>
    <button class="btn btn-primary" id="btnChanGo" type="button">去蓝牙页，让下一条走本地</button>

    <div class="chan-sep"></div>

    <div class="chan-sec">车辆图片</div>
    <div class="chan-hint">车卡上那张图可以换：暗色 / 浅色各存一张，互不覆盖。</div>
    <div class="chan-imgs">
      <button class="btn btn-ghost" id="btnCarPick" type="button">换一张</button>
      <button class="btn btn-ghost" id="btnCarReset" type="button">恢复默认</button>
    </div>
    <div class="chan-tip">也可以在车卡上长按换图、双击还原。</div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="chanClose" type="button">知道了</button>
    </div>
  </div>
</div>
